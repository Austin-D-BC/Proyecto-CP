<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ubic. Técnicas">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mapa de Ubicaciones Técnicas – Fundo Compositan</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#14202e;--mute:#667587;--line:#dde3ea;--acc:#2563eb;--ok:#059669;--warn:#d97706;--bad:#dc2626;
  --c-fundo:#1f3a5f;--c-filt:#2563eb;--c-mod:#0d9488;--c-gen:#7c5cbf;--c-pozo:#0284c7;--c-imp:#b7791f;--c-ele:#d97706;--c-alq:#64748b;--c-san:#c2410c;
  --shadow:0 1px 2px rgba(20,32,46,.08),0 6px 18px rgba(20,32,46,.07);
}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--panel:#17202a;--ink:#e8eef5;--mute:#8b9bad;--line:#263341;--shadow:0 1px 2px #0006,0 6px 18px #0005}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;cursor:pointer}
h1 small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.search:before{content:"🔍";position:absolute;left:11px;top:9px;font-size:14px;opacity:.6}
#results{position:absolute;left:0;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:9}
#results div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#results div:hover{background:var(--bg)}
#results b{font-size:14px}#results span{display:block;font-size:12px;color:var(--mute)}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;position:relative;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.s{padding:5px 10px;font-size:13px}
.badge{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.net{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.net.on{background:#d1fae5;color:#065f46}.net.off{background:#fee2e2;color:#991b1b}
.who{font-size:12px;color:var(--mute);text-align:right;line-height:1.2}
main{max-width:1200px;margin:0 auto;padding:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.crumb{border:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;box-shadow:var(--shadow)}
.crumb.cur{outline:3px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.sep{color:var(--mute)}
.head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head h2{margin:0;font-size:20px}
.head code{background:var(--bg);padding:3px 8px;border-radius:6px;font-size:12px;border:1px solid var(--line);cursor:pointer}
.head .stats{margin-left:auto;color:var(--mute);font-size:13px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);font-weight:700;margin:20px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{border:0;text-align:left;color:#fff;border-radius:16px;padding:14px;min-height:112px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transform:scale(.6);opacity:0;animation:pop .38s cubic-bezier(.2,1.3,.4,1) forwards;transition:transform .15s,filter .15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px) scale(1.02)!important;filter:brightness(1.08)}
.tile:active{transform:scale(.97)!important}
.tile:after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:#fff2}
@keyframes pop{to{transform:scale(1);opacity:1}}
.tile .code{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.5px}
.tile .nm{font-size:16px;font-weight:700;line-height:1.2;margin:4px 0}
.tile .cnt{font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.tile .cnt i{font-style:normal;background:#0003;border-radius:999px;padding:2px 8px}
.tile.big{min-height:170px;grid-column:1/-1;max-width:420px;margin:30px auto}
.tile.big .nm{font-size:26px}
.tile.anul{filter:grayscale(.9) brightness(.9);opacity:.7}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.fbar label.chk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.fbar .cnt{margin-left:auto;font-size:13px;color:var(--mute)}
.msel{position:relative}
.mpanel{position:absolute;top:42px;left:0;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;min-width:260px;max-height:300px;overflow:auto;display:none}
.mpanel.open{display:block}
.mpanel label{display:flex;gap:8px;align-items:center;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:14px}
.mpanel label:hover{background:var(--bg)}
.mpanel label span{margin-left:auto;color:var(--mute);font-size:12px}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.eq{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer}
.eq:hover{box-shadow:var(--shadow)}
.eq .n{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.eq .t{font-weight:600;margin-top:2px;word-break:break-word}
.eq .k{font-size:12px;color:var(--mute);margin-top:2px}
.eq .u{font-size:11px;color:var(--mute);margin-top:4px;border-top:1px dashed var(--line);padding-top:4px}
.b{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:700;white-space:nowrap}
.b.new{background:#fef3c7;color:#92400e}.b.ok{background:#d1fae5;color:#065f46}.b.red{background:#fee2e2;color:#991b1b}.b.blue{background:#dbeafe;color:#1e40af}.b.gray{background:#e5e7eb;color:#374151}
@media (prefers-color-scheme:dark){.b.new{background:#4a3410;color:#fcd34d}.b.ok{background:#0d3b2e;color:#6ee7b7}.b.red{background:#4c1616;color:#fca5a5}.b.blue{background:#172a52;color:#93c5fd}.b.gray{background:#2b3541;color:#cbd5e1}}
.empty{color:var(--mute);padding:30px;text-align:center}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}
#modal .card{background:var(--panel);border-radius:16px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow);margin:auto}
#modal h3{margin:0 0 4px;font-size:18px}
dl.d{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;margin:14px 0;font-size:14px}
dl.d dt{color:var(--mute)}dl.d dd{margin:0;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14202e;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;display:none;z-index:40;max-width:90vw;text-align:center}
/* formularios */
.f{display:grid;gap:10px;margin-top:10px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:3px}
.f input,.f select,.f textarea,.in{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
.f textarea{min-height:70px}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.f .row{grid-template-columns:1fr}dl.d{grid-template-columns:1fr}}
.seg{display:grid;gap:8px}
.seg label{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-size:15px;color:var(--ink);font-weight:600;margin:0}
.seg label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.seg input{width:auto}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px}
.rep{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel);border-left:5px solid var(--acc)}
.rep.nuevo{border-left-color:var(--warn)}.rep.registrado{border-left-color:var(--ok)}.rep.descartado{border-left-color:var(--mute);opacity:.7}
.rep .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.rep p{margin:6px 0;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn.on{background:var(--ink);color:var(--bg)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#1f3a5f,#0d9488)}
#login .card{background:var(--panel);border-radius:20px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px #0005}
#login h2{margin:0 0 4px}
.roles{display:grid;gap:8px;margin:14px 0}
.roles label{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600}
.roles label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.roles input{width:auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.formgrid label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:3px}
.devline{font-size:12px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.devline .w{color:var(--bad);font-weight:700}.devline .g{color:var(--ok);font-weight:700}
@media(max-width:700px){main{padding:12px}header{padding:8px 12px}.nav{width:100%}.btn{padding:9px 11px}.head .stats{margin-left:0}}
.formgrid label small{font-weight:400;opacity:.8}

/* lista que sugiere lo más cercano */
.ac{display:none;position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-top:2px;max-height:300px;overflow:auto}
.aci{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:1px;font-size:14px}
.aci:last-child{border-bottom:0}.aci:active,.aci:hover{background:var(--bg)}
.aci span{font-size:12px;color:var(--mute);word-break:break-all}
.cc{float:right;font-weight:700;color:var(--acc);font-size:12px}.cc b{font-size:13px}
.hint{font-size:12px;color:var(--mute);margin-top:3px}
.fw{position:relative}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.th{position:relative}.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#dc2626;color:#fff;font-size:13px;cursor:pointer}
.fotos{margin-top:8px;font-size:13px}
.chkrow{display:flex;gap:8px;align-items:center;cursor:pointer}.chkrow input,.chkrow2 input{width:auto;transform:scale(1.2)}
.chkrow2{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
</style>
</head>
<body>

<div id="login" style="display:none"><div class="card">
  <h2>Ubicaciones Técnicas</h2>
  <div style="color:var(--mute);font-size:13px">DANPER · Fundo Compositan</div>
  <div class="roles" id="roles">
    <label><input type="radio" name="rol" value="programador"> 🛠 Programador</label>
    <label><input type="radio" name="rol" value="supervisor" checked> 👷 Supervisores</label>
    <label><input type="radio" name="rol" value="tecnico"> 🔧 Técnicos</label>
  </div>
  <div class="f">
    <div id="wName"><label id="lNameLb">Tu nombre (aparecerá en tus reportes)</label><input id="lname" placeholder="Ej. Juan Pérez" autocomplete="off" autocapitalize="none"></div>
    <div><label>Clave</label><input id="lpass" type="password" placeholder="Clave de acceso" autocomplete="off"></div>
  </div>
  <div class="err" id="lerr"></div>
  <div style="font-size:12px;color:var(--mute);text-align:center;margin:6px 0">Código de este equipo: <b id="lDev"></b></div>
  <button class="btn p" id="lgo" style="width:100%;margin-top:6px;padding:12px">Ingresar</button>
</div></div>

<div id="app" style="display:none">
<header>
  <h1 id="home">Ubicaciones Técnicas<small>Fundo Compositan · toca un cuadro para entrar</small></h1>
  <div class="search"><input id="q" placeholder="Buscar equipo, N° o ubicación…" autocomplete="off"><div id="results"></div></div>
  <div class="nav">
    <span class="net on" id="net">En línea</span>
    <button class="btn p" id="bStatus">STATUS</button>
    <button class="btn" id="bRep">📋 Reportes<span class="badge" id="repBadge" style="display:none"></span></button>
    <button class="btn" id="bReg" style="display:none">➕ Registrar equipo</button>
    <button class="btn" id="bCfg" style="display:none">⚙</button>
    <div class="who" id="who"></div>
    <button class="btn s" id="bOut">Salir</button>
  </div>
</header>
<main>
  <div id="page"></div>
</main>
</div>
<div id="modal"><div class="card" id="mcard"></div></div>
<div class="toast" id="toast"></div>

<script>

/* ---------- SHA-256 (para no dejar las claves en texto plano) ---------- */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(unescape(encodeURIComponent(str)),c=>c.charCodeAt(0));
  const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=R(a,2)^R(a,13)^R(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+bb)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}

/* Llamada al receptor de Google. Devuelve el JSON, o null si no hubo respuesta (sin señal / servidor viejo). */
async function api(a,body,auth){
  if(!CFG.endpoint||!navigator.onLine)return null;
  try{
    const r=await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,auth:auth||authObj(),...(body||{})})});
    return await r.json();
  }catch(e){return null}
}

async function login(){
  const rol=document.querySelector('input[name=rol]:checked').value;
  const name=$('#lname').value.trim(), pass=$('#lpass').value, btn=$('#lgo'), er=m=>{$('#lerr').textContent=m};
  if(rol!=='programador'&&!name)return er(rol==='supervisor'?'Escribe tu usuario.':'Escribe tu nombre.');
  if(!pass)return er('Escribe la clave.');
  const h=sha256(pass);btn.disabled=true;er('Verificando…');
  let S=null;
  const res=await api('login',{},{rol,user:name,h});
  if(res&&res.ok)S={rol,name:res.name||name,user:res.user||name,h};
  else if(res&&res.error==='credenciales'){
    store.set('dp_cred',store.get('dp_cred',[]).filter(x=>!(x.rol===rol&&norm(x.user)===norm(name))));
    btn.disabled=false;return er(rol==='supervisor'?'Usuario o clave incorrectos.':'Clave incorrecta.');
  }else{
    // sin respuesta del servidor: se permite solo si este equipo ya ingresó antes con los mismos datos
    const c=store.get('dp_cred',[]).find(x=>x.rol===rol&&norm(x.user)===norm(name)&&x.h===h);
    if(c)S={rol,name:c.name,user:c.user,h};
    // TRANSICIÓN: mientras el script de Google siga en la versión anterior (no responde en el formato nuevo), se acepta la clave antigua.

  const cr=store.get('dp_cred',[]).filter(x=>!(x.rol===S.rol&&norm(x.user)===norm(S.user)));

function buildEq(){
  EQ=DATA.eq.map(e=>({...e,k:eqKey(e),ut0:e.ut,estado0:e.estado||''}));
  const byK={};EQ.forEach(e=>byK[e.k]=e);

  REGS.forEach(r=>{

    if(r.base){const e=byK[r.base];if(e){Object.keys(c).forEach(f=>{if(c[f])e[f]=c[f]});e.regId=r.id;e.all=r.all;e.fotos=r.fotos;e.src=(e.src||'')+' · modificado'}}
    else{const e={...c,k:'R:'+r.id,src:'Registrado por programador',regId:r.id,all:r.all,fotos:r.fotos,estado0:''};EQ.push(e);byK[e.k]=e}
  });
  EQ.forEach((e,i)=>{e.i=i;e.ut0=e.ut;e.estado=e.estado0;e.tipoN=DATA.tipos[e.tipo]||e.tipo||'Sin tipo';e.clasN=e.clas||'Sin clasificar'});
  // cambios aplicados (traslados, paradas, modificaciones), del más antiguo al más nuevo
  [...CAMB].sort((a,b)=>(a.ts||'').localeCompare(b.ts||'')).forEach(c=>{
    const e=byK[c.key];if(!e)return;
    if(c.ut)e.ut=c.ut;

  });

let flushing=false;
const saveOps=()=>store.set('dp_opq',OPQ);
function queue(op){OPQ.push(op);saveOps();flushOps()}
async function flushOps(){
  if(!isProg()||!OPQ.length||flushing)return;
  flushing=true;
  try{
    while(OPQ.length){
      const r=await api(OPQ[0].a,OPQ[0]);
      if(!r)break;                                   // sin señal: se reintenta luego
      if(!r.ok&&r.error==='auth'){toast('Tu clave de programador ya no es válida. Vuelve a ingresar.');break}
      OPQ.shift();saveOps();
    }
  }finally{flushing=false}
}
function addCambio(c){c.id=c.id||newId('C');c.ts=c.ts||new Date().toISOString();c.by=c.by||SES.name;CAMB.push(c);store.set('dp_camb',CAMB);buildEq();queue({a:'cambio_add',cambios:[c]})}
function delCambios(ids){CAMB=CAMB.filter(c=>!ids.includes(c.id));store.set('dp_camb',CAMB);buildEq();queue({a:'cambio_del',ids})}
function saveReg(r){const i=REGS.findIndex(x=>x.id===r.id);if(i<0)REGS.push(r);else REGS[i]=r;store.set('dp_regs',REGS);buildEq();queue({a:'reg_save',registro:r})}
function delReg(id){REGS=REGS.filter(x=>x.id!==id);store.set('dp_regs',REGS);REGSEL.delete(id);buildEq();queue({a:'reg_del',id})}
function setReview(r,v){r.review=v;saveReps();queue({a:'review',id:r.id,review:v})}
function mergeReports(list){
  let n=0;
  list.forEach(j=>{
    const x=REPS.find(y=>y.id===j.id);
    if(x){x.review=j.review||x.review;if(j.fotos)x.fotos=j.fotos}
    else{REPS.unshift({...j,delivery:'recibido',review:j.review||'nuevo'});if((j.review||'nuevo')==='nuevo')n++}
  });
  if(list.length)saveReps();
  return n;
}
/* Trae del servidor los cambios y equipos (todos) y, para el programador, los reportes. Devuelve nº de reportes nuevos. */
async function pullState(manual){
  if(!SES)return 0;
  if(!CFG.endpoint||!navigator.onLine){if(manual)toast('Sin señal o sin servidor configurado.');return 0}
  await flushOps();
  if(OPQ.length){if(manual)toast('Hay cambios tuyos pendientes de enviar; reintenta con señal.');return 0}
  const r=await api('state',{});
  if(!r||!r.ok){if(manual)toast('No se pudo consultar el servidor.'+(r&&r.error==='auth'?' Vuelve a ingresar.':''));return 0}
  const before=JSON.stringify([CAMB,REGS]);
  CAMB=r.cambios||[];REGS=r.registros||[];store.set('dp_camb',CAMB);store.set('dp_regs',REGS);
  const n=r.reportes?mergeReports(r.reportes):0;
  const changed=before!==JSON.stringify([CAMB,REGS]);
  if(changed)buildEq();
  if(changed||n)window._changed=true;
  return n;
}
/* Pasa a la nube lo que el programador tenía guardado solo en su equipo (versión anterior de la app) */
function migrateOld(){
  const old=store.get('dp_over',null);
  if(old&&Object.keys(old).length){
    Object.entries(old).forEach(([key,o])=>{
      const e=EQ.find(x=>x.k===key||eqKey(x)===key);if(!e)return;
      const c={id:newId('C'),ts:new Date().toISOString(),by:'Programador (anterior)',key:e.k,eqName:e.name,eqNum:e.num,tipo:'manual',from:e.ut0,ut:o.ut||'',estado:o.estado||'',motivo:o.motivo||''};
      CAMB.push(c);OPQ.push({a:'cambio_add',cambios:[c]});
    });
    store.set('dp_camb',CAMB);saveOps();
  }
  store.set('dp_over',{});
  let ch=false;
  REGS.forEach(r=>{if(!r.id){r.id=newId('E');r.base=null;r.all=r.all||{};ch=true;OPQ.push({a:'reg_save',registro:r})}});
  if(ch){store.set('dp_regs',REGS);saveOps()}
  buildEq();
}
const last=id=>id.split('-').pop();
const udesc=id=>nodes[id]?nodes[id].name:'';
function kind(id){
  const l=last(id), d=id.split('-').length;
  if(d===2) return 'fundo';
  if(/^F(\d\d|3B)$/.test(l)&&d===3) return 'filt';
  if(/^M\d+$/.test(l)) return 'mod';
  if(/^P\d+$/.test(l)) return 'pozo';
  return 'gen';
}
const COL={fundo:'--c-fundo',filt:'--c-filt',mod:'--c-mod',gen:'--c-gen',pozo:'--c-pozo',imp:'--c-imp',ele:'--c-ele',alq:'--c-alq',san:'--c-san'};
function color(id){
  const k=kind(id); if(k==='fundo')return COL.fundo;
  if(k==='filt')return COL.filt; if(k==='mod')return COL.mod;
  const l=id.split('-')[2]||'';
  if(/^F/.test(l))return COL.filt;
  return COL[{POZ:'pozo',IAG:'imp',MAG:'imp',MAQ:'alq',ELE:'ele',EFT:'san'}[l]]||COL.gen;
}
function total(id){const n=nodes[id];if(n._t==null)n._t=n.eq.length+n.kids.reduce((s,k)=>s+total(k),0);return n._t}
function allEq(id){const n=nodes[id];let r=[...n.eq];n.kids.forEach(k=>{r=r.concat(allEq(k))});return r}
function sortKids(ids){
  const r={filt:0,mod:1,pozo:2,gen:3};
  return [...ids].sort((a,b)=>{const ka=kind(a),kb=kind(b);if(ka!==kb)return (r[ka]??9)-(r[kb]??9);return a.localeCompare(b,'es',{numeric:true})});
}

/* ---------- lista desplegable que va sugiriendo lo más cercano (sirve en celular) ---------- */
function acSearch(items,q,max){
  const toks=norm(q).split(/[\s\-_/]+/).filter(Boolean);if(!toks.length)return [];
  const sc=[];
  items.forEach(it=>{
    const k=it._k||(it._k=norm(it.k||(it.t+' '+(it.s||''))));
    let full=true,s=0;
    for(const t of toks){const p=k.indexOf(t);if(p<0){full=false;continue}s+=p===0?6:(/[\s\-\/]/.test(k[p-1])?4:2)}
    if(s>0)sc.push({it,full,s});
  });
  const f=sc.filter(x=>x.full),use=f.length?f:sc;           // si nada coincide completo, se muestran los más parecidos
  return use.sort((a,b)=>b.s-a.s).slice(0,max||8).map(x=>x.it);
}
function attachAC(inp,getItems,onPick){
  const wrap=inp.parentNode;wrap.style.position='relative';
  const box=document.createElement('div');box.className='ac';wrap.appendChild(box);
  let picking=false;
  const draw=()=>{
    const list=acSearch(getItems(),inp.value);
    if(!list.length){box.style.display='none';return}
    box.innerHTML=list.map((it,i)=>`<div class="aci" data-ix="${i}"><b>${esc(it.t)}</b><span>${esc(it.s||'')}</span></div>`).join('');
    box.style.display='block';
    box.querySelectorAll('.aci').forEach(d=>d.onclick=()=>{
      const it=list[d.dataset.ix];inp.value=it.v;box.style.display='none';
      picking=true;inp.dispatchEvent(new Event('input',{bubbles:true}));picking=false;
      onPick&&onPick(it);
    });
  };
  inp.addEventListener('input',()=>{if(!picking)draw()});
  inp.addEventListener('focus',draw);
  return box;
}

const idb={db:null,
  open(){return new Promise((res,rej)=>{const q=indexedDB.open('dp_fotos',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async tx(mode,fn){const db=this.db||(this.db=await this.open());return new Promise((res,rej)=>{const t=db.transaction('f',mode);const o=fn(t.objectStore('f'));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})}
};
function readPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;
  });
}

const pending=()=>REPS.filter(r=>r.delivery==='pendiente');
function encode(reps){return 'DANPER-REPORTE:'+btoa(unescape(encodeURIComponent(JSON.stringify(reps))))}
function decode(txt){
  const out=[];const re=/DANPER-REPORTE:([A-Za-z0-9+\/=]+)/g;let m;
  while((m=re.exec(txt))){try{const a=JSON.parse(decodeURIComponent(escape(atob(m[1]))));out.push(...(Array.isArray(a)?a:[a]))}catch(e){}}
  return out;
}
function summary(r){return `• ${TIPOS_REP[r.tipo]} | ${r.eqNum||''} ${r.eqName} | ${r.origenUT?r.origenUT+' → ':''}${r.destUT||'-'} | ${r.by.name}`}

async function shareReps(reps){

async function sendPhotos(){
  let all;try{all=await idb.tx('readonly',s=>s.getAll())}catch(e){return}
  for(const f of (all||[])){
    const rep=REPS.find(x=>x.id===f.repId);

    const r=await api('foto',{id:f.id,repId:f.repId,kind:f.kind,name:f.name,mime:f.mime,data:f.data});
    if(!r)break;

  }

let syncing=false;
async function trySync(manual){
  if(syncing||!SES)return;
  if(!CFG.endpoint){if(manual)toast('No hay servidor configurado: usa Compartir por WhatsApp o Compartir respaldo.');return}
  if(!navigator.onLine){if(manual)toast('Sin señal. Quedan guardados en este equipo.');return}
  syncing=true;let sent=0;
  try{
    const p=pending();
    if(p.length){
      const r=await api('reports',{reports:p});
      if(r&&r.ok){p.forEach(x=>x.delivery='enviado');saveReps();sent=p.length;toast(`${p.length} reporte(s) enviado(s)`)}
      else if(manual||r)toast(r&&r.error==='auth'?'Tu acceso ya no es válido. Vuelve a ingresar.':'No se pudo enviar. Se reintentará solo.');
    }
    await sendPhotos();
    const n=await pullState(false);
    if(n)toast(`🔔 Llegaron ${n} reporte(s) nuevo(s)`);
  }catch(e){}
  syncing=false;
  const modalOpen=$('#modal').style.display==='flex';
  if(PAGE==='register'||modalOpen){refreshBadge();return}      // no pisar lo que se está escribiendo
  if(manual||sent||window._changed){window._changed=false;render()}else refreshBadge();
}

function wireTop(prog){

function download(name,content,type){

function fotosReg(f){
  if(!f||!f.length)return '';
  const g=k=>f.filter(x=>x.k===k).map(x=>`<a href="https://drive.google.com/file/d/${esc(x.fileId)}/view" target="_blank" rel="noopener"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${esc(x.fileId)}&sz=w240" alt=""></a>`).join('')||'<span style="color:var(--mute);font-size:12px">—</span>';
  return `<div class="fotos" style="margin-top:10px"><b>📷 Placas (para copiar los datos)</b><div class="thumbs">${g('placa')}</div><b>📷 Equipo completo</b><div class="thumbs">${g('equipo')}</div></div>`;
}

/* ---------- Excel (.xlsx) con el formato de EQUIPO PRINCIPAL, sin librerías ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
async function inflateRaw(u){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder(),out={};
  let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){
    const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u.subarray(p+46,p+46+nl));
    const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(start,start+cs);
    out[name]=meth===0?raw.slice():await inflateRaw(raw);
    p+=46+nl+el+cl;
  }
  return out;
}
function zipStore(files){
  const te=new TextEncoder(),parts=[],cen=[];let off=0;
  const w16=(a,v)=>a.push(v&255,(v>>>8)&255),w32=(a,v)=>a.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255);
  const names=Object.keys(files);
  for(const name of names){
    const data=files[name],nb=te.encode(name),crc=crc32(data),h=[],c=[];
    w32(h,0x04034b50);w16(h,20);w16(h,0x800);w16(h,0);w16(h,0);w16(h,0x21);w32(h,crc);w32(h,data.length);w32(h,data.length);w16(h,nb.length);w16(h,0);
    parts.push(Uint8Array.from(h),nb,data);
    w32(c,0x02014b50);w16(c,20);w16(c,20);w16(c,0x800);w16(c,0);w16(c,0);w16(c,0x21);w32(c,crc);w32(c,data.length);w32(c,data.length);w16(c,nb.length);w16(c,0);w16(c,0);w16(c,0);w16(c,0);w32(c,0);w32(c,off);
    cen.push(Uint8Array.from(c),nb);
    off+=h.length+nb.length+data.length;
  }
  const cs=cen.reduce((s,a)=>s+a.length,0),e=[];
  w32(e,0x06054b50);w16(e,0);w16(e,0);w16(e,names.length);w16(e,names.length);w32(e,cs);w32(e,off);w16(e,0);
  return new Blob([...parts,...cen,Uint8Array.from(e)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function buildXlsx(recs){
  const r=await fetch('plantilla.xlsx',{cache:'no-cache'});if(!r.ok)throw new Error('plantilla');
  const files=await unzip(await r.arrayBuffer());
  let xml=new TextDecoder().decode(files['xl/worksheets/sheet1.xml']);
  const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const idx=DATA.heads.map(h=>h.i);let rows='';
  recs.forEach((rc,n)=>{
    const R=7+n;let cells='';
    idx.forEach(i=>{const v=(rc.all||{})[i];if(v!==undefined&&v!=='')cells+=`<c r="${colL(i)}${R}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`});
    rows+=`<row r="${R}">${cells}</row>`;
  });
  xml=xml.replace('</sheetData>',rows+'</sheetData>').replace(/<dimension ref="[^"]*"\/>/,`<dimension ref="A1:AU${6+recs.length}"/>`);
  files['xl/worksheets/sheet1.xml']=new TextEncoder().encode(xml);
  return zipStore(files);
}

/* ---------- configuración ---------- */
const TIPO_CAMB={traslado:'Traslado',parada:'Parada',manual:'Modificado por programador'};
function renderConfig(){
  const camb=[...CAMB].sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  page.innerHTML=`<div class="panel"><h3>Servidor de recepción</h3>
    <div style="color:var(--mute);font-size:13px">Dirección del receptor de Google (archivo receptor_reportes.gs). Con esto todos los equipos envían reportes solos y ven lo que apruebas.</div>
    <input class="in" id="cEp" style="margin-top:10px" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.endpoint)}">
    <div class="acts"><button class="btn p" id="cSave">Guardar</button><button class="btn" id="cLink">Copiar enlace para configurar celulares</button></div></div>
    <div class="panel" id="pUsers"><h3>Usuarios</h3><div class="empty">Cargando…</div></div>
    <div class="panel"><h3>Cambios aplicados en el mapa (${camb.length})</h3>
    <div style="color:var(--mute);font-size:13px">Marca los que quieras deshacer; los demás se quedan. Se actualiza en todos los equipos.</div>
    ${camb.length?`<div class="acts"><button class="btn" id="cbAll">Marcar todos</button><button class="btn bad" id="cbUndo">Deshacer marcados</button></div>`+camb.map(c=>{
      const eq=c.eqName||c.key;
      return `<label class="rep chkrow2"><input type="checkbox" data-cb="${esc(c.id)}"><div><b>${esc(eq)}</b>${c.eqNum?` <span style="color:var(--mute)">${esc(c.eqNum)}</span>`:''}<br>
        <span style="font-size:13px">${esc(TIPO_CAMB[c.tipo]||c.tipo)}${c.from?` · de ${esc(last(c.from))}`:''}${c.ut?` → <b>${esc(last(c.ut))}</b> <span style="color:var(--mute)">${esc(udesc(c.ut))}</span>`:''}${c.estado?` · ${esc(c.estado)}${c.motivo?' ('+esc(c.motivo)+')':''}`:''}</span><br>
        <span style="font-size:12px;color:var(--mute)">${esc(c.by||'')} · ${c.ts?new Date(c.ts).toLocaleString('es-PE'):''}</span></div></label>`}).join(''):'<div class="empty">No hay cambios aplicados.</div>'}</div>`;
  $('#cLink').onclick=()=>{if(!CFG.endpoint)return toast('Primero guarda la dirección del receptor');copy(location.origin+location.pathname+'?srv='+encodeURIComponent(CFG.endpoint),'Enlace copiado: envíalo a los supervisores por WhatsApp')};
  $('#cSave').onclick=()=>{CFG.endpoint=$('#cEp').value.trim();store.set('dp_cfg',CFG);toast('Guardado');trySync(true)};
  if(camb.length){
    $('#cbAll').onclick=()=>{const bs=[...page.querySelectorAll('[data-cb]')],all=bs.some(b=>!b.checked);bs.forEach(b=>b.checked=all);$('#cbAll').textContent=all?'Desmarcar todos':'Marcar todos'};
    $('#cbUndo').onclick=()=>{
      const ids=[...page.querySelectorAll('[data-cb]:checked')].map(b=>b.dataset.cb);
      if(!ids.length)return toast('Marca los cambios que quieres deshacer.');
      if(confirm(`¿Deshacer ${ids.length} cambio(s)? Los equipos vuelven a donde estaban antes de esos cambios.`)){delCambios(ids);toast('Deshecho en todos los equipos');renderConfig()}
    };
  }
  loadUsers();
}
async function loadUsers(){
  const box=$('#pUsers');if(!box)return;
  const r=await api('users_list',{});
  if(!r||!r.ok){box.innerHTML='<h3>Usuarios</h3><div class="empty">No se pudo cargar. Revisa que haya señal y que ya hayas pegado la versión nueva del script de Google.</div>';return}
  box.innerHTML=`<h3>Usuarios</h3>
    <div style="color:var(--mute);font-size:13px;margin-bottom:8px"><b>Supervisores:</b> solo entran los usuarios que registres aquí, cada uno con su clave.</div>
    ${r.users.length?r.users.map(u=>`<div class="rep"><div class="top"><span><b>${esc(u.usuario)}</b> · ${esc(u.nombre)}</span><span class="b ${u.activo?'ok':'gray'}">${u.activo?'Activo':'Desactivado'}</span></div>
      <div class="acts"><button class="btn s" data-u="pass" data-n="${esc(u.usuario)}">Cambiar clave</button><button class="btn s" data-u="name" data-n="${esc(u.usuario)}" data-v="${esc(u.nombre)}">Cambiar nombre</button><button class="btn s" data-u="tog" data-n="${esc(u.usuario)}" data-v="${esc(u.nombre)}" data-a="${u.activo?1:0}">${u.activo?'Desactivar':'Activar'}</button><button class="btn s bad" data-u="del" data-n="${esc(u.usuario)}">Quitar</button></div></div>`).join(''):'<div class="empty">Aún no hay supervisores registrados: nadie de supervisión puede ingresar.</div>'}
    <div class="f" style="margin-top:12px"><label>Nuevo supervisor</label>
      <div class="row"><input class="in" id="nuUser" placeholder="Usuario (ej. jperez)" autocapitalize="none"><input class="in" id="nuName" placeholder="Nombre completo"></div>
      <input class="in" id="nuPass" placeholder="Clave (mínimo 4 caracteres)" style="margin-top:8px"></div>
    <div class="acts"><button class="btn p" id="nuAdd">Agregar supervisor</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <div style="color:var(--mute);font-size:13px;margin-bottom:8px"><b>Técnicos:</b> todos usan la misma clave. <b>Tu clave</b> de programador también se cambia aquí.</div>
    <div class="acts"><button class="btn" id="pTec">Cambiar clave de técnicos</button><button class="btn" id="pProg">Cambiar mi clave de programador</button></div>`;
  const ok=async(a,b,msg)=>{const x=await api(a,b);if(x&&x.ok){toast(msg||'Listo');loadUsers()}else toast('No se pudo guardar'+(x&&x.error?': '+x.error:'. Revisa la señal.'));return x};
  const askPass=t=>{const p=prompt(t);if(p===null)return null;if(p.length<4){toast('La clave debe tener al menos 4 caracteres.');return null}return p};
  box.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{
    const n=b.dataset.n,k=b.dataset.u;
    if(k==='pass'){const p=askPass('Nueva clave para «'+n+'»:');if(p)ok('user_save',{usuario:n,nombre:undefined,h:sha256(p)},'Clave cambiada')}
    if(k==='name'){const v=prompt('Nombre completo de «'+n+'»:',b.dataset.v);if(v&&v.trim())ok('user_save',{usuario:n,nombre:v.trim()},'Nombre cambiado')}
    if(k==='tog')ok('user_save',{usuario:n,nombre:b.dataset.v,activo:b.dataset.a!=='1'},b.dataset.a==='1'?'Desactivado':'Activado');
    if(k==='del'&&confirm('¿Quitar al usuario «'+n+'»? Ya no podrá ingresar.'))ok('user_del',{usuario:n},'Usuario quitado');
  });
  $('#nuAdd').onclick=()=>{
    const u=$('#nuUser').value.trim().toLowerCase().replace(/\s+/g,''),nm=$('#nuName').value.trim(),p=$('#nuPass').value;
    if(!u)return toast('Escribe el usuario (sin espacios).');
    if(p.length<4)return toast('La clave debe tener al menos 4 caracteres.');
    ok('user_save',{usuario:u,nombre:nm||u,h:sha256(p)},'Supervisor agregado');
  };
  $('#pTec').onclick=()=>{const p=askPass('Nueva clave para TODOS los técnicos:');if(p)ok('pass_set',{quien:'tec',h:sha256(p)},'Clave de técnicos cambiada')};
  $('#pProg').onclick=async()=>{
    const p=askPass('Tu nueva clave de programador:');if(!p)return;
    const h=sha256(p),x=await api('pass_set',{quien:'prog',h});
    if(x&&x.ok){SES.h=h;try{sessionStorage.setItem('dp_ses',JSON.stringify(SES))}catch(e){}
      store.set('dp_cred',store.get('dp_cred',[]).filter(c=>c.rol!=='programador').concat([{rol:'programador',user:'',name:'Programador',h}]));toast('Tu clave fue cambiada')}
    else toast('No se pudo cambiar la clave. Revisa la señal.');
  };
}

/* ---------- arranque ---------- */
function start(){
  $('#login').style.display='none';$('#app').style.display='block';
  const p=PERM[SES.rol];
  $('#bReg').style.display=p.registrar?'':'none';$('#bCfg').style.display=p.config?'':'none';
  $('#who').innerHTML=`${esc(SES.name)}<br>${ROLNAME[SES.rol]} · ${DEVCODE}`;
  if(isProg())migrateOld();
  setNet();PAGE='map';
  const h=location.hash.slice(1);if(h&&nodes[h]&&h!==ROOT)cur=h;
  render();trySync();
}
$('#lDev').textContent=DEVCODE;
if(SES&&SES.rol&&SES.h)start();else $('#login').style.display='flex';
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
